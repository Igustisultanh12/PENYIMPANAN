version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystorage_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - mystorage_network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: mystorage_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mystorage_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mystorage_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mystorage
      MYSQL_USER: mystorage_user
      MYSQL_PASSWORD: mystorage_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mystorage_network

  redis:
    image: redis:7-alpine
    container_name: mystorage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mystorage_network

  minio:
    image: minio/minio:latest
    container_name: mystorage_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - mystorage_network

networks:
  mystorage_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  storage_data:
